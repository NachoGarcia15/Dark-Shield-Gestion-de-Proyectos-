function ai(text,type,evn){const t=text.toLowerCase();let best='',bs=0;for(const k in KW){const s=KW[k].filter(w=>t.includes(w)).length;if(s>bs){bs=s;best=k}}

if(bs>=2&&type&&best!==type)f.push(`El texto encaja mejor con “${best}” que con “${type}”`),sc-=.15;
if((text.match(/https?:\/\//g)||[]).length>2||/(.)\1{5,}/.test(text)||(text.length>30&&text===text.toUpperCase()))f.push('Patrón de spam'),sc-=.4;
sc=Math.max(0,Math.min(1,sc));return{sug:best||type,sc,f,cls:f.some(x=>/spam/.test(x))?'sospechoso':f.length>1?'inconsistente':'correcto',res:text.trim().split(/(?<=[.!?])\s/)[0].slice(0,140)}}

if(S.tab=='ab')b=`<p class="mut">Límites: 3 reportes por minuto, 5 indicios por minuto, 8 consultas API por minuto, detección de duplicados.</p><table><tr><th>Fecha</th><th>Origen</th><th>Motivo</th></tr>${db.abuse.slice().reverse().map(a=>`<tr><td>${fd(a.t)}</td><td>${esc(a.k)}</td><td>${esc(a.why)}</td></tr>`).join('')}</table>`;
if(S.tab=='au'){let ok=1,p='0';db.audit.forEach(e=>{if(e.p!=p||e.h!=hs(e.p+e.t+e.u+e.a+e.d))ok=0;p=e.h});b=`<div class="warn ${ok?'ok-b':''}">${ok?'Cadena de auditoría íntegra':'Se detectó manipulación en el historial'}</div><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>${db.audit.slice().reverse().map(e=>`<tr><td>${fd(e.t)}</td><td>${esc(uname(e.u))}</td><td>${esc(e.a)}</td><td>${esc(e.d)}</td></tr>`).join('')}</table>`}
if(S.tab=='ia'){const c={};db.reports.forEach(r=>c[r.cls]=(c[r.cls]||0)+1);b=`<p>Clasificación de la IA: ${Object.entries(c).map(([k,v])=>`<span class="tag">${k}: ${v}</span>`).join(' ')}</p><label><input type="checkbox" style="width:auto" ${db.cfg.auto?'checked':''} onchange="db.cfg.auto=this.checked?1:0;save();toast('Configuración guardada')"> Ocultar automáticamente los reportes sospechosos hasta su revisión</label><p class="mut">La IA solo recomienda: ninguna acción irreversible se ejecuta sin la administración.</p>`}
if(S.tab=='at')b=`<p class="mut">Lanza ataques simulados de los agentes maliciosos del ConOps y comprueba cómo responde el sistema.</p><div class="row"><button class="btn bad" onclick="A.attack('spam')">Spammer</button><button class="btn bad" onclick="A.attack('rep')">Manipulador de reputación</button><button class="btn bad" onclick="A.attack('scr')">Scraper malicioso</button><button class="btn bad" onclick="A.attack('atk')">Atacante de la plataforma</button></div>${(S.lab||[]).map(x=>`<div class="warn ok-b">${esc(x)}</div>`).join('')}`;
return`<h1>Administración</h1><div class="tabs">${T.map(t=>`<button class="btn ${S.tab==t[0]?'':'s'}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div><div class="card">${b}</div>`};
const A={theme(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark'?'light':'dark'},
addev(id,inp){const f=inp.files[0],u=me(),r=db.reports.find(x=>x.id==id);if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>3e6)return toast('Archivo rechazado: solo PNG, JPG o WEBP de hasta 3 MB');if(r.ev.length>=8)return toast('Este reporte ya tiene el máximo de evidencias');if(!limit('ev'+u.id,4,6e4,'Exceso de evidencias'))return toast('Demasiadas evidencias seguidas');const im=new Image;im.onload=()=>{const k=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r.ev.push({n:f.name,d:c.toDataURL('image/jpeg',.6),sens:0,by:u.id});log(u.id,'Nueva evidencia','Reporte #'+id);save();toast('Evidencia añadida: credibilidad recalculada');render()};im.src=URL.createObjectURL(f)},
attack(k){const o=[];S.tab='at';
if(k=='spam'){RL['lab-spam']=[];let ok=0;for(let i=0;i<12;i++)limit('lab-spam',3,6e4,'Simulación de spam')&&ok++;o.push(`Spammer: 12 reportes en segundos. Aceptados ${ok}, bloqueados ${12-ok} por límite de frecuencia.`);o.push('Un texto repetido o en mayúsculas se clasifica como sospechoso y queda oculto para revisión.')}
if(k=='rep'){const r=structuredClone(db.reports[0]),n0=db.users.length;[101,102,103,104,105].forEach(i=>{db.users.push({id:i,name:'bot'+i,role:'colaborador',trust:5});r.votes[i]=-1});const a=cred(r,1),b=cred(r);db.users.splice(n0);o.push(`Manipulador: 5 cuentas nuevas invalidan un reporte legítimo. Sin defensa baja a ${a.p}%; con detección de votos coordinados queda en ${b.p}% y se avisa a la administración.`);db.abuse.push({t:Date.now(),k:'lab-rep',why:'Simulación de votos coordinados de 5 cuentas nuevas'})}
if(k=='scr'){RL['lab-api']=[];let ok=0;for(let i=0;i<30;i++)limit('lab-api',8,6e4,'Simulación de scraping')&&ok++;o.push(`Scraper: 30 consultas a la API. Atendidas ${ok}, rechazadas ${30-ok} con HTTP 429.`)}
if(k=='atk'){const c=structuredClone(db.audit);c[0].d='Entrada alterada';o.push(chain(c)?'La alteración no se detectó':'Atacante: se modificó una entrada del historial y la verificación de la cadena detectó la manipulación.')}
S.lab=[...o,...(S.lab||[])].slice(0,8);log(db.me,'Simulación de ataque',k);save();render()},
login(v){db.me=v?+v:null;if(!nav().some(n=>n[0]==S.view)&&S.view!='detalle')S.view='explorar';save();render()},
reg(){const n=$('#nn').value.trim();if(n.length<3)return toast('Escribe un nombre de al menos 3 letras');const id=Math.max(...db.users.map(u=>u.id))+1;db.users.push({id,name:n,role:'colaborador',trust:10});db.me=id;log(id,'Registro','Nueva cuenta de colaborador');save();toast('Cuenta creada con confianza inicial 10');render()},
vote(id,v){const u=me(),r=db.reports.find(x=>x.id==id);if(!limit('vote'+u.id,10,6e4,'Exceso de valoraciones de '+u.name))return toast('Demasiadas valoraciones seguidas');const first=!(u.id in r.votes);r.votes[u.id]=v;if(first)u.trust=Math.min(100,u.trust+1);const c=cred(r),au=db.users.find(x=>x.id==r.by);if(c.n>=3&&c.p>=70&&!r.rw){r.rw=1;au.trust=Math.min(100,au.trust+3);toast('El autor gana confianza por un reporte creíble')}if(c.n>=3&&c.p<30&&!r.pn){r.pn=1;au.trust=Math.max(0,au.trust-3)}log(u.id,v>0?'Validación':'Invalidación','Reporte #'+id);save();render()},
mod(id,a){const r=db.reports.find(x=>x.id==id);if(a=='hide')r.hidden=r.hidden?0:1;if(a=='sens')r.ev.forEach(e=>e.sens=e.sens?0:1);if(a=='sanc'){const u=db.users.find(x=>x.id==r.by);u.trust=Math.max(0,u.trust-20);if(!u.trust)u.susp=1;r.hidden=1;db.sanc.push({u:u.id,t:Date.now()})}log(db.me,'Moderación: '+a,'Reporte #'+id);save();render()},
role(id,r){db.users.find(u=>u.id==id).role=r;log(db.me,'Cambio de rol',uname(id)+' pasa a '+r);save();toast('Rol actualizado')},
susp(id){const u=db.users.find(x=>x.id==id);u.susp=u.susp?0:1;log(db.me,u.susp?'Suspensión':'Reactivación',u.name);save();render()},
edit(id){S.edit=id;S.ev=db.reports.find(r=>r.id==id).ev.slice();go('nuevo');setTimeout(()=>A.prev(),0)},
prev(){$('#evp').innerHTML=S.ev.map((e,i)=>`<figure>${e.d?`<img alt="" src="${e.d}">`:`<div class="ph">${esc(e.n)}</div>`}<figcaption>${esc(e.n)} <button class="btn s" onclick="S.ev.splice(${i},1);A.prev()">Quitar</button></figcaption></figure>`).join('')},
files(inp){[...inp.files].forEach(f=>{if(S.ev.length>=4)return toast('Máximo 4 evidencias');if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>3e6)return toast(`Archivo rechazado: ${f.name} (solo PNG, JPG o WEBP de hasta 3 MB)`);
const im=new Image;im.onload=()=>{const k=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.ev.push({n:f.name,d:c.toDataURL('image/jpeg',.6),sens:$('#f-sens').checked?1:0});A.prev()};im.src=URL.createObjectURL(f)});inp.value=''},
read(){return{url:$('#f-url').value.trim(),type:$('#f-type').value,title:$('#f-title').value.trim(),desc:$('#f-desc').value.trim()}},
analyze(){const f=A.read();if(f.desc.length<10)return toast('Escribe primero la descripción');S.ai=ai(f.desc,f.type,S.ev.length);const a=S.ai;
$('#aib').innerHTML=`<div class="warn ${a.cls=='correcto'?'ok-b':''}"><b>Análisis de apoyo (no decide la validez)</b><br>Resumen: ${esc(a.res)}<br>Tipo sugerido: ${esc(a.sug)}. Clasificación: ${a.cls}, calidad ${Math.round(a.sc*100)}%.<ul>${a.f.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Sin incidencias detectadas</li>'}</ul></div>`},
send(){const u=me(),f=A.read(),d=dom(f.url);if(!d)return toast('La dirección no es válida');if(f.title.length<5)return toast('El título necesita al menos 5 caracteres');if(f.desc.length<30)return toast('Describe el caso con al menos 30 caracteres');if(u.susp)return toast('Tu cuenta está suspendida');
const a=ai(f.desc,f.type,S.ev.length),sens=$('#f-sens').checked;S.ev.forEach(e=>{if(sens)e.sens=1});
if(S.edit){const r=db.reports.find(x=>x.id==S.edit);r.history.push({t:Date.now(),d:'Edición de título, descripción o evidencias',o:r.desc,n:f.desc});Object.assign(r,{type:f.type,title:f.title,desc:f.desc,ev:S.ev,ai:a.sc,cls:a.cls});log(u.id,'Edición','Reporte #'+r.id);save();return go('detalle',r.id)}
if(!limit('rep'+u.id,3,6e4,'Más de 3 reportes por minuto de '+u.name))return toast('Has alcanzado el límite de reportes por minuto');
const w=new Set(f.desc.toLowerCase().split(/\W+/)),dup=db.reports.find(r=>r.dom==d&&(()=>{const o=new Set(r.desc.toLowerCase().split(/\W+/));return[...w].filter(x=>o.has(x)).length/new Set([...w,...o]).size>.6})());
if(dup){db.abuse.push({t:Date.now(),k:'rep'+u.id,why:'Contenido duplicado del reporte #'+dup.id});save();return toast('Ya existe un reporte muy parecido (#'+dup.id+'). Valídalo en lugar de duplicarlo')}
const id=Math.max(0,...db.reports.map(r=>r.id))+1;db.reports.push(R({id,url:f.url,dom:d,type:f.type,title:f.title,desc:f.desc,by:u.id,at:Date.now(),ai:a.sc,cls:a.cls,ev:S.ev,hidden:a.cls=='sospechoso'&&db.cfg.auto?1:0}));
db.pages.filter(p=>p.ver&&p.dom==d).forEach(p=>db.notifs.push({to:p.owner,t:Date.now(),m:'Nuevo reporte sobre '+d+': '+f.title}));log(u.id,'Nuevo reporte','#'+id+' sobre '+d);save();
if(a.cls=='sospechoso')toast('La IA lo marcó como sospechoso: queda en revisión');go('detalle',id)},
hint(d){const n=$('#hn').value.trim();if(n.length<5)return toast('Describe el indicio en pocas palabras');if(!limit('hint'+(db.me||'anon'),5,6e4,'Exceso de indicios'))return toast('Demasiados indicios seguidos');db.hints.push({dom:d,note:n,at:Date.now()});save();toast('Gracias. Los colaboradores podrán revisarlo');render()},
regdom(){const d=dom($('#nd').value);if(!d)return toast('Dominio no válido');if(db.pages.some(p=>p.dom==d))return toast('Ese dominio ya está registrado');db.pages.push({dom:d,owner:db.me,token:'ds-'+Math.random().toString(16).slice(2,8),ver:0});log(db.me,'Registro de página',d);save();render()},
verify(d){db.pages.find(p=>p.dom==d).ver=1;log(db.me,'Verificación de dominio',d);save();render()},
api(){const d=dom($('#ad').value);if(!limit('api'+db.me,8,6e4,'Posible extracción masiva vía API'))S.api='HTTP 429 Too Many Requests';else if(!db.pages.some(p=>p.dom==d&&p.owner==db.me&&p.ver))S.api='HTTP 403: solo puedes consultar dominios propios verificados';else S.api=JSON.stringify({dominio:d,reportes:db.reports.filter(r=>r.dom==d&&!r.hidden).map(r=>({id:r.id,tipo:r.type,titulo:r.title,credibilidad:cred(r).p}))},null,2);render()}};
load();render();const h0=location.hash.slice(1);if(h0.startsWith('r-')){S.id=+h0.slice(2);S.view='detalle';render()}
</script></body></html>
